# Aircraft Enrichment Cron Worker
# Runs daily at midnight UTC to look up missing aircraft types using Gemini

name = "kuuki-aircraft-enrichment"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Schedule: Daily at midnight UTC
[triggers]
crons = ["0 0 * * *"]

# Environment variables (set via wrangler secret put)
# GEMINI_API_KEY - Google Gemini API key
# SUPABASE_URL - Supabase project URL
# SUPABASE_SERVICE_KEY - Supabase service role key (for server-side access)
