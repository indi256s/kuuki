# Import job Worker (ADR 0001 §9). It hosts the ImportJob Durable Object that kuuki-next reaches through its
# IMPORT_JOBS binding; it has no public surface (default fetch is 404, no routes, no workers.dev or preview URLs).
# Deploys need explicit authorization: kuuki-import-preview before `kuuki-next --env preview`, then kuuki-import
# before kuuki-next. Local development uses wrangler.local.toml.
name = "kuuki-import"
main = "./index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["enable_request_signal", "request_signal_passthrough"]
workers_dev = false
preview_urls = false

# Set per Worker with `wrangler secret put GEMINI_API_KEY [--env preview]`. GEMINI_IMPORT_MODEL stays optional.
[secrets]
required = ["GEMINI_API_KEY"]

[observability]
enabled = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "IMPORT_JOBS"
class_name = "ImportJob"

# Migrations inherit into [env.preview]; bindings and D1 do not.
[[migrations]]
tag = "import-job-v1"
new_sqlite_classes = ["ImportJob"]

# The same D1 as kuuki-next in each environment: jobs write drafts directly.
[[d1_databases]]
binding = "DB"
database_name = "kuuki-db"
database_id = "2a8e3895-6a98-4473-8d7b-a43ca0c0026f"
migrations_dir = "../../db/migrations"

[env.preview]
name = "kuuki-import-preview"
workers_dev = false
preview_urls = false

[env.preview.secrets]
required = ["GEMINI_API_KEY"]

[env.preview.ai]
binding = "AI"

[[env.preview.durable_objects.bindings]]
name = "IMPORT_JOBS"
class_name = "ImportJob"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "kuuki-preview"
database_id = "80e0c789-c1ab-4aa5-a6fe-e65c6e6cb74c"
migrations_dir = "../../db/migrations"
