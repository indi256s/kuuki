# Kuuki - Cloudflare Pages Functions Configuration
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "kuuki"
pages_build_output_dir = "./apps/web/dist"
compatibility_date = "2024-01-01"

# Enable Node.js compatibility for AI SDK
compatibility_flags = ["nodejs_compat"]

# Environment variables for Functions
[vars]
# Add any non-secret environment variables here

# KV Namespaces
[[kv_namespaces]]
binding = "IMPORT_JOBS"
id = "15bad9e7dfa44f8382883513c8bff292"
