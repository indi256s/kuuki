# Kuuki - Cloudflare Pages Functions Configuration
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "kuuki"
pages_build_output_dir = "./apps/web/dist"
compatibility_date = "2025-09-23"

# Enable Node.js compatibility for AI SDK
compatibility_flags = ["nodejs_compat"]

# Environment variables for Functions
[vars]
# Add any non-secret environment variables here
PAGES_ORIGIN = "https://kuuki.pages.dev"  # canonical origin reflected by _lib/cors.ts (override per-env)

# KV Namespaces
[[kv_namespaces]]
binding = "IMPORT_JOBS"
id = "15bad9e7dfa44f8382883513c8bff292"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "kuuki-db"
database_id = "2a8e3895-6a98-4473-8d7b-a43ca0c0026f"
migrations_dir = "db/migrations"
