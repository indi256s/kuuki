name = "kuuki-next"
main = "worker.ts"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]
# Production serves only through this zone route. wrangler deploy PUTs `routes` as the Worker's complete set.
# routes, workers_dev and preview_urls inherit into environments, so each [env.*] sets all three.
routes = [{ pattern = "kuuki.marchstudio.uk/*", zone_name = "marchstudio.uk" }]
workers_dev = false
preview_urls = false

# Set per Worker with `wrangler secret put`. Deploy fails if one is missing. `secrets` does not inherit.
[secrets]
required = ["AUTH_SECRET", "BETTER_AUTH_SECRET", "GEMINI_API_KEY"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[observability]
enabled = true

[vars]
PAGES_ORIGIN = "https://kuuki.marchstudio.uk"
MAINTENANCE_MODE = "false"
ACTIVATION_ORIGIN = "https://kuuki-activation.indi256s.workers.dev"
ACTIVATION_MAIL_ACCOUNT_ID = "5cadcff0282e54f3ff1d7062d4dbb97a"
ACTIVATION_MAIL_FROM = "accounts@marchstudio.uk"

[[send_email]]
name = "ACTIVATION_MAIL"
allowed_sender_addresses = ["accounts@marchstudio.uk"]

[[d1_databases]]
binding = "DB"
database_name = "kuuki-db"
database_id = "2a8e3895-6a98-4473-8d7b-a43ca0c0026f"
migrations_dir = "../../db/migrations"

# Same build as production, served on its own workers.dev origin for account activation.
[env.activation]
name = "kuuki-activation"
routes = []
workers_dev = true
preview_urls = false

[env.activation.secrets]
required = ["AUTH_SECRET", "BETTER_AUTH_SECRET"]

[env.activation.vars]
PAGES_ORIGIN = "https://kuuki.marchstudio.uk"
MAINTENANCE_MODE = "false"
ACTIVATION_ORIGIN = "https://kuuki-activation.indi256s.workers.dev"
ACTIVATION_MAIL_ACCOUNT_ID = "5cadcff0282e54f3ff1d7062d4dbb97a"
ACTIVATION_MAIL_FROM = "accounts@marchstudio.uk"

[[env.activation.send_email]]
name = "ACTIVATION_MAIL"
allowed_sender_addresses = ["accounts@marchstudio.uk"]

[[env.activation.d1_databases]]
binding = "DB"
database_name = "kuuki-db"
database_id = "2a8e3895-6a98-4473-8d7b-a43ca0c0026f"
migrations_dir = "../../db/migrations"

# kuuki-next-preview, against the preview D1. Origins match the live preview Workers.
[env.preview]
routes = []
workers_dev = true
preview_urls = true

[env.preview.secrets]
required = ["AUTH_SECRET", "BETTER_AUTH_SECRET", "GEMINI_API_KEY"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "kuuki-preview"
database_id = "80e0c789-c1ab-4aa5-a6fe-e65c6e6cb74c"
migrations_dir = "../../db/migrations"

[env.preview.vars]
PAGES_ORIGIN = "https://kuuki-next-preview.indi256s.workers.dev"
MAINTENANCE_MODE = "false"
ACTIVATION_ORIGIN = "https://kuuki-release-activation-preview.indi256s.workers.dev"
ACTIVATION_MAIL_ACCOUNT_ID = "5cadcff0282e54f3ff1d7062d4dbb97a"
ACTIVATION_MAIL_FROM = "accounts@marchstudio.uk"

[[env.preview.send_email]]
name = "ACTIVATION_MAIL"
allowed_sender_addresses = ["accounts@marchstudio.uk"]
