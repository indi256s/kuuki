<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!-- Isolated activation page (boards 2.3 activation variant and 2.4). Its CSP is default-src 'none': no app scripts,
       stylesheets, fonts or images, so it is self-contained and uses the system font stack (webfonts cannot load here). -->
    <script src="/activate.js"></script>
    <title>Welcome back to Kuuki</title>
    <!-- scripts/build-next.mjs fills this with the :root theme and accent tokens from apps/next/src/app/styles.css. -->
    <style id="activation-tokens"></style>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font:
          400 15px/24px system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      a,
      button,
      input {
        outline: none;
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      h1:focus,
      h2:focus {
        outline: none;
      }
      .defs {
        position: absolute;
      }

      /* Wordmark: "Ku" in the accent text, "uki" in the text color. */
      .wordmark {
        position: relative;
        display: inline-flex;
        align-items: baseline;
        font-size: 36px;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.04em;
        white-space: nowrap;
      }
      .wordmark-ku {
        color: var(--accent-text);
      }
      .wordmark-uki {
        color: var(--text);
      }

      /* Page and card (desktop, boards 1.1 and 3.1). */
      .page {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
      }
      .card {
        position: relative;
        display: flex;
        width: min(1040px, 100%);
        min-height: 620px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius-lg);
        background: var(--surface);
        overflow: clip;
      }
      :root[data-theme='dark'] .card {
        border-color: transparent;
        box-shadow: inset 0 1px 0 var(--surface-highlight);
      }
      .brand {
        position: relative;
        flex: 0 0 min(420px, 40%);
        display: flex;
        flex-direction: column;
        padding: 40px;
        overflow: clip;
        background: var(--auth-brand-surface, var(--surface-inset));
      }
      .brand-field {
        position: absolute;
        inset: 0;
        pointer-events: none;
        --plane-cycle: 60s;
      }
      .kana {
        position: absolute;
        left: 128px;
        top: 86px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        color: var(--accent);
        opacity: 0.1;
        font: 700 164px/164px var(--font-kana);
      }
      :root[data-theme='dark'] .kana {
        opacity: 0.13;
      }
      .planes {
        position: absolute;
        left: 0;
        top: 0;
        fill: none;
        stroke: var(--accent);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .planes-desktop {
        mask-image: radial-gradient(ellipse 100px 46px at 84px 58px, transparent 70%, var(--text));
      }
      .planes-mobile {
        display: none;
        mask-image: radial-gradient(ellipse 90px 44px at 53px 41px, transparent 70%, var(--text));
      }
      /* Same lap and speed as the card: start at the drawn position; wrap outside the field. */
      @keyframes plane-drift {
        from {
          transform: translate(calc(var(--plane-start) * 400px), calc(var(--plane-start) * -800px));
        }
        to {
          transform: translate(
            calc((var(--plane-start) + var(--plane-span)) * 400px),
            calc((var(--plane-start) + var(--plane-span)) * -800px)
          );
        }
      }
      .plane {
        animation: plane-drift calc(var(--plane-span) * var(--plane-cycle)) linear infinite;
        animation-delay: calc(var(--plane-start) * var(--plane-cycle));
        animation-play-state: running;
      }
      .brand-field:not([data-running='true']) .plane,
      .planes-mobile .plane {
        animation-play-state: paused;
      }
      .plane-s {
        stroke-opacity: 0.22;
      }
      .plane-m {
        stroke-opacity: 0.302;
      }
      .plane-l {
        stroke-opacity: 0.4;
      }
      :root[data-theme='dark'] .plane-s {
        stroke-opacity: 0.278;
      }
      :root[data-theme='dark'] .plane-m {
        stroke-opacity: 0.38;
      }
      :root[data-theme='dark'] .plane-l {
        stroke-opacity: 0.502;
      }
      .panel {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 96px clamp(24px, 6vw, 64px) 48px;
      }
      .column {
        display: flex;
        flex-direction: column;
        width: min(360px, 100%);
      }
      .state {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      /* Corner controls: animation pause, language and the Horizon theme toggle, each at least 44x44. */
      .corner {
        position: absolute;
        top: 36px;
        right: 28px;
        z-index: 1;
        display: flex;
        align-items: center;
      }
      .corner-control {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 20px;
        font-weight: 500;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform var(--dur-press) var(--ease-out),
          background-color var(--dur-fast) var(--ease-out);
      }
      .corner-control:active {
        transform: scale(0.96);
      }
      /* Both names share one cell: the other keeps its box but leaves the accessible name, so the width never changes. */
      .corner-language {
        display: inline-grid;
        justify-items: center;
        padding-inline: 12px;
      }
      .corner-language > span {
        grid-area: 1 / 1;
      }
      .corner-language > span[aria-hidden='true'] {
        visibility: hidden;
      }
      .icon {
        flex-shrink: 0;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Keyline sun and sunset horizon preserve the theme control’s motion and optical centring. */
      .horizon {
        fill: currentColor;
        translate: 0 -0.5px;
        transition: translate 500ms cubic-bezier(0, 0, 0.15, 1);
      }
      .horizon-sun {
        transition: transform 500ms cubic-bezier(0, 0, 0.15, 1);
      }
      :root[data-theme='dark'] .horizon {
        translate: 0 -4.5px;
      }
      :root[data-theme='dark'] .horizon-sun {
        transform: translateY(16px);
      }

      html {
        scrollbar-gutter: stable;
      }

      /* Heading, field and actions (boards 2.3 and 2.4). */
      .heading {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 36px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .heading p {
        margin: 0;
        color: var(--text-muted);
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 28px;
        margin: 0;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 13px;
        line-height: 20px;
        font-weight: 500;
      }
      .control {
        position: relative;
      }
      .control input {
        width: 100%;
        height: 44px;
        padding: 0 41px 0 14px;
        border: 1px solid var(--control-border);
        border-radius: var(--radius-sm);
        background: var(--auth-input-surface, var(--background));
        color: var(--text);
        font-size: 15px;
        line-height: 24px;
      }
      .control input[aria-invalid='true'] {
        border-color: var(--danger-text);
      }
      .control input[readonly] {
        border-color: var(--hairline);
        color: var(--text-muted);
      }
      .reveal {
        position: absolute;
        top: 50%;
        right: 1px;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text-muted);
        translate: 0 -50%;
        cursor: pointer;
        transition: background-color var(--dur-fast) var(--ease-out);
      }
      .hint {
        margin: 0;
        font-size: 13px;
        line-height: 20px;
        color: var(--text-muted);
      }
      .error {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        padding-top: 2px;
        font-size: 13px;
        line-height: 20px;
        color: var(--danger-text);
      }
      .actions {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .primary {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: var(--accent-foreground);
        font-size: 15px;
        line-height: 24px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform var(--dur-press) var(--ease-out),
          background-color var(--dur-fast) var(--ease-out);
      }
      .primary:active:not([aria-disabled='true']) {
        transform: scale(0.96);
      }
      .primary[aria-disabled='true'] {
        cursor: progress;
      }
      .spinner {
        animation: spin 0.8s linear infinite;
        stroke-width: 2;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      .text-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 44px;
        color: var(--accent-text);
        font-size: 13px;
        line-height: 20px;
        font-weight: 500;
        text-decoration: none;
        text-underline-offset: 3px;
        border-radius: var(--radius-xs);
      }

      @media (hover: hover) and (pointer: fine) {
        .corner-control:hover,
        .reveal:hover {
          background: var(--surface-inset);
        }
        .primary:hover:not([aria-disabled='true']) {
          background: var(--accent-hover);
        }
        .text-link:hover {
          text-decoration: underline;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .corner-control,
        .reveal,
        .primary,
        .horizon,
        .horizon-sun {
          transition: none;
        }
        .primary:active:not([aria-disabled='true']),
        .corner-control:active {
          transform: none;
        }
        .plane,
        .spinner {
          animation: none;
        }
      }

      /* Mobile: brand band above a bottom sheet (boards 3.2 and 3.3). */
      @media (max-width: 700px) {
        body {
          background: var(--auth-band-surface, var(--surface-inset));
        }
        .page {
          display: block;
          padding: 0;
        }
        .card,
        :root[data-theme='dark'] .card {
          flex-direction: column;
          width: 100%;
          min-height: 100dvh;
          border: 0;
          border-radius: 0;
          box-shadow: none;
          background: transparent;
          overflow: visible;
        }
        .brand {
          flex: 0 0 auto;
          height: clamp(160px, 100dvh - 480px, 302px);
          padding: 12px 6px 0 19px;
          background: var(--auth-band-surface, var(--surface-inset));
        }
        .wordmark {
          font-size: 28px;
        }
        .kana {
          left: 0;
          right: 0;
          top: 125px;
          flex-direction: row;
          justify-content: center;
          font-size: 104px;
          line-height: 104px;
          letter-spacing: 0.04em;
        }
        .planes-desktop {
          display: none;
        }
        .planes-desktop .plane {
          animation-play-state: paused;
        }
        .brand-field[data-running='true'] .planes-mobile .plane {
          animation-play-state: running;
        }
        .planes-mobile {
          display: block;
          left: 50%;
          top: -15px;
          margin-left: -195px;
        }
        .corner {
          top: 4px;
          right: 6px;
        }
        .panel {
          flex: 1 0 auto;
          padding: 28px 20px 46px;
          border-radius: var(--radius-lg) var(--radius-lg) 0 0;
          background: var(--surface);
          box-shadow: var(--auth-sheet-edge, 0 -1px 0 var(--hairline));
        }
        .column {
          width: 100%;
        }
        .state,
        form {
          gap: 24px;
        }
        h1 {
          font-size: 28px;
          line-height: 34px;
        }
        .control input {
          height: 48px;
          padding-right: 47px;
          font-size: 16px;
        }
        .reveal {
          right: 3px;
          width: 44px;
          height: 44px;
        }
        .primary {
          height: 48px;
          font-size: 16px;
        }
      }
    </style>
  </head>

              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M2 22H22"
                transform="scale(1.333333)"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <g clip-path="url(#horizon-clip)">
                <g class="horizon-sun">
                  <g
                    transform="scale(1.333333)"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M16.5 12C16.5 14.4854 14.4854 16.5 12 16.5C9.5147 16.5 7.5 14.4854 7.5 12C7.5 9.5147 9.5147 7.5 12 7.5C14.4854 7.5 16.5 9.5147 16.5 12ZM20.5 12L22 12M18.0104 18.0104L19.0711 19.0711M12 20.5L12 22M5.9896 18.0104L4.9289 19.0711M3.5 12L2 12M5.9896 5.9896L4.9289 4.9289M12 3.5L12 2M18.0104 5.9896L19.0711 4.9289"
                      fill="none"
                    />
                  </g>
                </g>
              </g>
            </svg>
          </button>
        </div>
        <main class="panel">
          <div class="column">
            <section id="set-password" class="state" hidden>
              <div class="heading">
                <h1 id="set-heading" tabindex="-1" data-i18n="heading">Welcome back to Kuuki</h1>
                <p data-i18n="description">
                  Kuuki has moved. Set a password to open your journal. Your flights are all there.
                </p>
              </div>
              <form id="activation-form" novalidate>
                <!-- Lets a password manager file the new password; it holds the email when the page knows it. -->
                <input id="username" name="username" type="email" autocomplete="username" hidden />
                <div class="field">
                  <label for="password" data-i18n="password">New password</label>
                  <div class="control">
                    <input
                      id="password"
                      name="password"
                      type="password"
                      autocomplete="new-password"
                      maxlength="1024"
                      aria-describedby="password-hint"
                    />
                    <button
                      id="reveal"
                      class="reveal"
                      type="button"
                      aria-pressed="false"
                      aria-label="Show password"
                      data-i18n-label="show"
                    >
                      <svg
                        id="eye"
                        class="icon"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path
                          d="M2 12C3.0523 7.3229 7.206 4 12 4C16.794 4 20.9477 7.3229 22 12C20.9477 16.6771 16.794 20 12 20C7.206 20 3.0523 16.6771 2 12ZM15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z"
                        />
                      </svg>
                      <svg
                        id="eye-off"
                        class="icon"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        hidden
                        focusable="false"
                      >
                        <path
                          d="M18.035 18.035C16.3283 19.2786 14.2337 20 12 20C7.206 20 3.0523 16.6771 2 12C2.562 9.5021 4.0086 7.3904 5.965 5.965M9.8779 4.2211C10.565 4.076 11.2752 4 12 4C16.794 4 20.9477 7.3229 22 12C21.7487 13.1169 21.3206 14.1566 20.7491 15.0922M14.1213 14.1213C13.5785 14.6642 12.8285 15 12 15C10.3431 15 9 13.6569 9 12C9 11.1716 9.3358 10.4216 9.8787 9.8787M2 2L22 22"
                        />
                      </svg>
                    </button>
                  </div>
                  <p id="password-hint" class="hint" data-i18n="rule">At least 8 characters</p>
                  <p id="password-error" class="error" role="alert" hidden>
                    <svg
                      class="icon"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      aria-hidden="true"
                      focusable="false"
                    >
                      <path
                        d="M22 12C22 17.52285 17.52285 22 12 22C6.47715 22 2 17.52285 2 12C2 6.47715 6.47715 2 12 2C17.52285 2 22 6.47715 22 12Z"
                      />
                      <path d="M12 7V13" />
                      <path
                        d="M13 17C13 17.55228 12.55228 18 12 18C11.44772 18 11 17.55228 11 17C11 16.44772 11.44772 16 12 16C12.55228 16 13 16.44772 13 17Z"
                        fill="currentColor"
                        stroke="none"
                      /></svg
                    ><span id="password-error-text"></span>
                  </p>
                </div>
                <button id="submit" class="primary" type="submit" aria-disabled="false">
                  <svg
                    id="spinner"
                    class="icon spinner"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    hidden
                    focusable="false"
                  >
                    <path
                      d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2"
                    />
                  </svg>
                  <span id="submit-label">Save password</span>
                </button>
              </form>
            </section>
            <section id="expired" class="state" hidden>
              <div class="heading">
                <h1 id="expired-heading" tabindex="-1" data-i18n="expiredHeading">
                  This link has expired
                </h1>
                <p data-i18n="expiredDescription">Links work once, for 30 minutes.</p>
              </div>
              <div class="actions">
                <a
                  id="resend"
                  class="primary"
                  href="/"
                  data-primary-path="/activation-request"
                  data-i18n="resend"
                  >Send a new link</a
                >
                <a id="signin" class="text-link" href="/" data-primary-path="/signin"
                  ><svg
                    class="icon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M19 12H5.94129M11.8771 5L5.17385 11.5875C4.94205 11.8153 4.94205 12.1847 5.17385 12.4125L11.8771 19"
                    /></svg
                  ><span data-i18n="signin">Back to sign in</span></a
                >
              </div>
            </section>
            <!-- Where a saved password goes: the card's password-saved notice on the main origin (rewritten by the Worker). -->
            <a
              id="saved"
              href="/?mode=signin"
              data-primary-path="/?mode=signin&notice=password-saved"
              hidden
            ></a>
            <noscript
              ><p>
                Enable JavaScript to set your password. / Включите JavaScript, чтобы задать пароль.
              </p></noscript
            >
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
