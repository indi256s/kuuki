<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Activate your Kuuki account</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f9; color: #17242b; }
    main { box-sizing: border-box; width: min(100% - 2rem, 28rem); padding: 2rem; background: white; border: 1px solid #dbe5eb; border-radius: 1rem; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 1rem 0 .35rem; }
    input, button { box-sizing: border-box; width: 100%; padding: .75rem; font: inherit; border-radius: .5rem; }
    input { border: 1px solid #8c9da8; }
    button { margin-top: 1.25rem; border: 0; background: #176782; color: white; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    a { color: #176782; }
    #status { min-height: 1.5em; }
    @media (prefers-color-scheme: dark) { body { background: #101b22; color: #eef6f8; } main { background: #1b2a32; border-color: #3d5059; } input { background: #101b22; color: inherit; } a { color: #8ed6eb; } }
  </style>
</head>
<body>
  <main>
    <h1>Activate your account</h1>
    <p>Choose a personal password to access your existing Kuuki profile.</p>
    <form id="activation-form" hidden>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmation">Confirm password</label>
      <input id="confirmation" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submit" type="submit">Activate account</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a href="/?mode=signin">Back to sign in</a>
  </main>
  <script src="/activate.js"></script>
</body>
</html>
