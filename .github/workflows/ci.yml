name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 24

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:api
      - run: pnpm typecheck:scripts
      - run: pnpm typecheck:maintenance
      - run: pnpm typecheck:import
      - run: pnpm --filter @kuuki/web test:run
      - run: pnpm test:api
      - run: pnpm --filter @kuuki/next test
      - run: node --test scripts/check-preview-config.test.mjs
      - run: pnpm exec tsx scripts/map-geometry.test.ts
      - run: node scripts/check-preview-config.mjs --config apps/next/wrangler.toml --maintenance-config workers/maintenance/wrangler.toml
      - run: pnpm --filter @kuuki/web build
      - run: pnpm build:api
      - run: pnpm build:maintenance
      - run: WRANGLER_SEND_METRICS=false pnpm build:import
      - run: pnpm smoke:runtime
      - name: Check api-routes.generated.ts is current (run node scripts/build-next.mjs --inventory-only and commit the file)
        run: node scripts/build-next.mjs --inventory-only && git diff --exit-code apps/next/api-routes.generated.ts
      - run: pnpm next:build
      - run: pnpm --filter @kuuki/next typecheck:worker
      - run: pnpm --filter @kuuki/next exec playwright install --with-deps chromium
      - run: pnpm next:smoke
      - run: pnpm next:smoke:boundary
      - run: pnpm exec tsx scripts/rehearse-next-rollback.ts
      - run: pnpm test:next:navigation
      - run: node scripts/next-artifact-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: next-candidate-${{ github.sha }}
          path: |
            .wrangler/next-build/
            .wrangler/functions-build/
            workers/maintenance/.wrangler/maintenance-build/
            .wrangler/next-artifact-manifest.json
            apps/next/.open-next/worker.js
            apps/next/.open-next/assets/
            apps/next/.next/required-server-files.json
            apps/next/.next/BUILD_ID
            apps/next/api-routes.generated.ts
            apps/next/wrangler.toml
            apps/next/next.config.ts
            apps/next/open-next.config.ts
            apps/next/worker.ts
            apps/next/package.json
            apps/web/dist-legacy/
            apps/web/dist/
            wrangler.toml
            workers/maintenance/wrangler.toml
            package.json
            pnpm-lock.yaml
            scripts/build-next.mjs
            scripts/next-artifact-manifest.mjs
            scripts/rehearse-next-rollback.ts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    needs: verify
    if: github.event_name == 'pull_request' && vars.PREVIEW_ISOLATION_VERIFIED == 'true'
    concurrency:
      group: kuuki-staging-deployment
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-preview-config.mjs
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
      - run: pnpm exec wrangler pages deploy apps/web/dist --project-name=kuuki --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-maintenance:
    needs: [verify, deploy-production]
    if: vars.MAINTENANCE_DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm exec wrangler deploy --config workers/maintenance/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PREVIEW_ISOLATION_VERIFIED == 'true' && vars.GIT_DEPLOY_DISABLED == 'true' && vars.PRODUCTION_RELEASE_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-preview-config.mjs
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
      - run: pnpm exec wrangler pages deploy apps/web/dist --project-name=kuuki --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
