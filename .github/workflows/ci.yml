name: CI/CD

# Verification only. Production deploys are manual: see docs/skills/deploy-kuuki/SKILL.md.
on:
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'docs/**', '.scratch/**']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'docs/**', '.scratch/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 24

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:api
      - run: pnpm typecheck:scripts
      - run: pnpm typecheck:maintenance
      - run: pnpm typecheck:import
      - name: Check api-routes.generated.ts is current (run node scripts/build-next.mjs --inventory-only and commit the file)
        run: node scripts/build-next.mjs --inventory-only && git diff --exit-code apps/next/api-routes.generated.ts
      - run: pnpm --filter @kuuki/next test
      - run: node --test scripts/check-preview-config.test.mjs scripts/dependency-patches.test.mjs
      - run: pnpm exec tsx scripts/map-geometry.test.ts
      - run: node scripts/check-preview-config.mjs --config apps/next/wrangler.toml --maintenance-config workers/maintenance/wrangler.toml
      - run: WRANGLER_SEND_METRICS=false pnpm build:import

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm turbo run build --filter='./packages/*'
      # Vitest defaults to CPUs - 1 workers, which is one on a 2-vCPU runner; each test spends most of its time in workerd.
      - run: pnpm test:api --shard=${{ matrix.shard }}/3 --maxWorkers=2

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm turbo run build --filter='./packages/*'
      - run: pnpm next:build
      - run: pnpm --filter @kuuki/next typecheck:worker
      - id: playwright
        run: echo "version=$(node -p "require('./apps/next/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      # Headless runs use only chromium-headless-shell; the runner image already has its system libraries.
      - run: pnpm --filter @kuuki/next exec playwright install --only-shell chromium
      - run: pnpm next:smoke
      - run: pnpm next:smoke:boundary
      # Release 3 verification excludes visual/layout checks and screenshot traces by owner instruction.
      - run: >-
          pnpm test:next:navigation
          tests/account.test.ts tests/auth-recovery.test.ts tests/capture.test.ts
          tests/import.test.ts tests/map.test.ts tests/navigation.test.ts tests/onboarding.test.ts
          tests/passport.test.ts tests/pwa-upgrade.test.ts tests/read-journeys.test.ts
          tests/reset-password.test.ts tests/route-transitions.test.ts tests/settings.test.ts
          tests/shell.test.ts tests/theme-toggle.test.ts
          --grep-invert 'member header contains|profile keeps maximum|Commissioner loads|Add sheet sits above|header is 48px|tab labels fit|header is 56px|Journal rows keep|RU read controls fit|opens Passport without the hero at 390px|processing text keeps|moves the sun|animates over 500ms|calendar stays anchored|new country stamps stagger'
          --trace off
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.sha }}
          path: apps/next/test-results/
          retention-days: 7
