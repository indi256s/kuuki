name: React Doctor
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base revision for changed-scope diagnostics
        required: true
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run React Doctor
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: npx -y react-doctor@0.9.17 . --scope changed --base "$BASE_REF" --no-score
